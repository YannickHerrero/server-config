---
- name: Grant the managed user access to KVM
  become: true
  become_user: root
  when: server_config_android_enabled
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups:
      - kvm
    append: true
  tags:
    - android
    - users

- name: Install the headless Android host packages
  become: true
  become_user: root
  when:
    - server_config_android_enabled
  ansible.builtin.apt:
    name: "{{ server_config_android_host_packages }}"
    state: present
  tags:
    - android
    - packages

- name: Inspect the pinned Android command-line tools
  become: true
  become_user: root
  when:
    - server_config_android_enabled
  ansible.builtin.stat:
    path: >-
      {{ server_config_android_sdk_root }}/cmdline-tools/{{
        server_config_android_commandline_tools_version
      }}/bin/sdkmanager
  register: server_config_android_commandline_tools
  tags:
    - android

- name: Create the Android SDK directories
  become: true
  become_user: root
  when:
    - server_config_android_enabled
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
    state: directory
  loop:
    - path: "{{ server_config_android_sdk_root }}"
      mode: "0755"
    - path: "{{ server_config_android_sdk_root }}/cmdline-tools"
      mode: "0755"
    - path: >-
        {{ server_config_android_sdk_root }}/cmdline-tools/{{ server_config_android_commandline_tools_version }}
      mode: "0755"
    - path: /var/cache/server-config
      mode: "0755"
  tags:
    - android

- name: Download the pinned Android command-line tools
  become: true
  become_user: root
  when:
    - server_config_android_enabled
    - not ansible_check_mode or server_config_android_commandline_tools.stat.exists
  ansible.builtin.get_url:
    url: "{{ server_config_android_commandline_tools_url }}"
    dest: >-
      /var/cache/server-config/android-commandline-tools-{{ server_config_android_commandline_tools_version }}.zip
    checksum: "sha256:{{ server_config_android_commandline_tools_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  tags:
    - android

- name: Extract the pinned Android command-line tools
  become: true
  become_user: root
  when:
    - server_config_android_enabled
    - not ansible_check_mode or server_config_android_commandline_tools.stat.exists
  ansible.builtin.unarchive:
    src: >-
      /var/cache/server-config/android-commandline-tools-{{ server_config_android_commandline_tools_version }}.zip
    dest: >-
      {{ server_config_android_sdk_root }}/cmdline-tools/{{ server_config_android_commandline_tools_version }}
    remote_src: true
    creates: >-
      {{ server_config_android_sdk_root }}/cmdline-tools/{{
        server_config_android_commandline_tools_version
      }}/bin/sdkmanager
    owner: root
    group: root
  tags:
    - android

- name: Flatten the versioned Android command-line tools directory
  become: true
  become_user: root
  when:
    - server_config_android_enabled
    - not ansible_check_mode
    - not server_config_android_commandline_tools.stat.exists
  ansible.builtin.command:
    argv:
      - /usr/bin/mv
      - >-
        {{ server_config_android_sdk_root }}/cmdline-tools/{{
          server_config_android_commandline_tools_version
        }}/cmdline-tools/bin
      - >-
        {{ server_config_android_sdk_root }}/cmdline-tools/{{
          server_config_android_commandline_tools_version
        }}/cmdline-tools/lib
      - >-
        {{ server_config_android_sdk_root }}/cmdline-tools/{{
          server_config_android_commandline_tools_version
        }}/cmdline-tools/NOTICE.txt
      - >-
        {{ server_config_android_sdk_root }}/cmdline-tools/{{
          server_config_android_commandline_tools_version
        }}/cmdline-tools/source.properties
      - >-
        {{ server_config_android_sdk_root }}/cmdline-tools/{{
          server_config_android_commandline_tools_version
        }}/
  changed_when: true
  tags:
    - android

- name: Remove the nested Android command-line tools directory
  become: true
  become_user: root
  when:
    - server_config_android_enabled
    - not ansible_check_mode
    - not server_config_android_commandline_tools.stat.exists
  ansible.builtin.file:
    path: >-
      {{ server_config_android_sdk_root }}/cmdline-tools/{{
        server_config_android_commandline_tools_version
      }}/cmdline-tools
    state: absent
  tags:
    - android

- name: Normalize the Android command-line tools permissions
  become: true
  become_user: root
  when:
    - server_config_android_enabled
    - not ansible_check_mode or server_config_android_commandline_tools.stat.exists
  ansible.builtin.file:
    path: >-
      {{ server_config_android_sdk_root }}/cmdline-tools/{{
        server_config_android_commandline_tools_version
      }}
    owner: root
    group: root
    mode: "u=rwX,go=rX"
    recurse: true
    state: directory
  tags:
    - android

- name: Select the pinned Android command-line tools
  become: true
  become_user: root
  when:
    - server_config_android_enabled
    - not ansible_check_mode or server_config_android_commandline_tools.stat.exists
  ansible.builtin.file:
    src: >-
      {{ server_config_android_sdk_root }}/cmdline-tools/{{
        server_config_android_commandline_tools_version
      }}
    dest: "{{ server_config_android_sdk_root }}/cmdline-tools/latest"
    owner: root
    group: root
    state: link
  tags:
    - android

- name: Report the planned Android command-line tools installation
  when:
    - server_config_android_enabled
    - ansible_check_mode
    - not server_config_android_commandline_tools.stat.exists
  ansible.builtin.debug:
    msg: >-
      Install Android command-line tools
      {{ server_config_android_commandline_tools_version }}
  changed_when: true
  tags:
    - android

- name: Inspect Android SDK licenses
  become: true
  become_user: root
  when:
    - server_config_android_enabled
  ansible.builtin.stat:
    path: "{{ server_config_android_sdk_root }}/licenses/android-sdk-license"
  register: server_config_android_license
  tags:
    - android

- name: Accept Android SDK package licenses
  become: true
  become_user: root
  when:
    - server_config_android_enabled
    - not server_config_android_license.stat.exists
    - not ansible_check_mode
  ansible.builtin.command:
    argv:
      - "{{ server_config_android_sdk_root }}/cmdline-tools/latest/bin/sdkmanager"
      - "--sdk_root={{ server_config_android_sdk_root }}"
      - --licenses
    stdin: "{{ ('y\n' * 50) }}"
  environment:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
  changed_when: true
  tags:
    - android

- name: Report the planned Android license acceptance
  when:
    - server_config_android_enabled
    - ansible_check_mode
    - not server_config_android_license.stat.exists
  ansible.builtin.debug:
    msg: Accept the Android SDK licenses required by the pinned QA packages
  changed_when: true
  tags:
    - android

- name: Inspect the pinned Android SDK packages
  become: true
  become_user: root
  when:
    - server_config_android_enabled
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - >-
      {{ server_config_android_sdk_root }}/build-tools/{{
        server_config_android_build_tools_version
      }}/aapt2
    - "{{ server_config_android_sdk_root }}/emulator/emulator"
    - "{{ server_config_android_sdk_root }}/platform-tools/adb"
    - >-
      {{ server_config_android_sdk_root }}/platforms/android-{{
        server_config_android_api_level
      }}/android.jar
    - >-
      {{ server_config_android_sdk_root }}/system-images/android-{{
        server_config_android_api_level
      }}/google_apis/x86_64/package.xml
  register: server_config_android_package_paths
  tags:
    - android

- name: Install the pinned Android SDK packages
  become: true
  become_user: root
  when:
    - server_config_android_enabled
    - not (server_config_android_package_paths.results | map(attribute='stat.exists') | min)
    - not ansible_check_mode
  ansible.builtin.command:
    argv: >-
      {{
        [
          server_config_android_sdk_root + '/cmdline-tools/latest/bin/sdkmanager',
          '--sdk_root=' + server_config_android_sdk_root
        ]
        + server_config_android_packages
      }}
  environment:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
  changed_when: true
  tags:
    - android

- name: Normalize the Android SDK package permissions
  become: true
  become_user: root
  when:
    - server_config_android_enabled
    - >-
      not ansible_check_mode
      or (server_config_android_package_paths.results | map(attribute='stat.exists') | min)
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "u=rwX,go=rX"
    recurse: true
    state: directory
  loop:
    - "{{ server_config_android_sdk_root }}/.sdk"
    - "{{ server_config_android_sdk_root }}/build-tools"
    - "{{ server_config_android_sdk_root }}/emulator"
    - "{{ server_config_android_sdk_root }}/licenses"
    - "{{ server_config_android_sdk_root }}/platforms"
    - "{{ server_config_android_sdk_root }}/platform-tools"
    - "{{ server_config_android_sdk_root }}/system-images"
  tags:
    - android

- name: Inspect the installed Android SDK package set
  become: true
  become_user: root
  when:
    - server_config_android_enabled
    - not ansible_check_mode
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - >-
      {{ server_config_android_sdk_root }}/build-tools/{{
        server_config_android_build_tools_version
      }}/aapt2
    - "{{ server_config_android_sdk_root }}/emulator/emulator"
    - "{{ server_config_android_sdk_root }}/platform-tools/adb"
    - >-
      {{ server_config_android_sdk_root }}/platforms/android-{{
        server_config_android_api_level
      }}/android.jar
    - >-
      {{ server_config_android_sdk_root }}/system-images/android-{{
        server_config_android_api_level
      }}/google_apis/x86_64/package.xml
  register: server_config_android_installed_package_paths
  tags:
    - android

- name: Verify the installed Android SDK package set
  when:
    - server_config_android_enabled
    - not ansible_check_mode
  ansible.builtin.assert:
    that:
      - server_config_android_installed_package_paths.results | map(attribute='stat.exists') | min
    fail_msg: The pinned Android SDK package set is incomplete.
    quiet: true
  tags:
    - android
