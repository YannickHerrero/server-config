---
- name: Inspect the retired Multica account
  become: true
  become_user: root
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ server_config_multica_legacy_user }}"
  register: server_config_multica_legacy_account
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - multica
    - users

- name: Stop and disable the retired Multica Docker service
  become: true
  become_user: root
  when:
    - server_config_multica_enabled
    - server_config_multica_legacy_account.rc == 0
  ansible.builtin.systemd_service:
    name: "server-config-docker@{{ server_config_multica_legacy_user }}.service"
    enabled: false
    state: stopped
  tags:
    - docker
    - multica
    - users

- name: Remove retired Multica access to the managed user's home
  become: true
  become_user: root
  when:
    - server_config_multica_enabled
    - server_config_multica_legacy_account.rc == 0
  ansible.posix.acl:
    path: "{{ ansible_user_dir }}"
    entity: "{{ server_config_multica_legacy_user }}"
    etype: user
    state: absent
  tags:
    - multica
    - users

- name: Remove retired Multica access to development files
  become: true
  become_user: root
  when:
    - server_config_multica_enabled
    - server_config_multica_legacy_account.rc == 0
  ansible.posix.acl:
    path: "{{ ansible_user_dir }}/dev"
    entity: "{{ server_config_multica_legacy_user }}"
    etype: user
    recursive: true
    state: absent
  tags:
    - multica
    - users

- name: Remove retired Multica default development access
  become: true
  become_user: root
  when:
    - server_config_multica_enabled
    - server_config_multica_legacy_account.rc == 0
  ansible.posix.acl:
    path: "{{ ansible_user_dir }}/dev"
    entity: "{{ server_config_multica_legacy_user }}"
    etype: user
    default: true
    recursive: true
    state: absent
  tags:
    - multica
    - users

- name: Remove retired Multica subordinate IDs
  become: true
  become_user: root
  when: server_config_multica_enabled
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^{{ server_config_multica_legacy_user | regex_escape }}:"
    state: absent
  loop:
    - /etc/subuid
    - /etc/subgid
  tags:
    - docker
    - multica
    - users

- name: Terminate processes owned by the retired Multica account
  become: true
  become_user: root
  when:
    - server_config_multica_enabled
    - server_config_multica_legacy_account.rc == 0
    - not ansible_check_mode
  ansible.builtin.command:
    argv:
      - /usr/bin/pkill
      - --signal
      - TERM
      - --uid
      - "{{ server_config_multica_legacy_user }}"
  register: server_config_multica_legacy_processes_terminated
  changed_when: server_config_multica_legacy_processes_terminated.rc == 0
  failed_when: server_config_multica_legacy_processes_terminated.rc not in [0, 1]
  tags:
    - multica
    - users

- name: Wait for retired Multica processes to exit
  become: true
  become_user: root
  when:
    - server_config_multica_enabled
    - server_config_multica_legacy_account.rc == 0
    - not ansible_check_mode
  ansible.builtin.command:
    argv:
      - /usr/bin/pgrep
      - --uid
      - "{{ server_config_multica_legacy_user }}"
  register: server_config_multica_legacy_processes
  changed_when: false
  failed_when: server_config_multica_legacy_processes.rc not in [0, 1]
  retries: 10
  delay: 1
  until: server_config_multica_legacy_processes.rc == 1
  tags:
    - multica
    - users

- name: Remove the retired Multica account
  become: true
  become_user: root
  when:
    - server_config_multica_enabled
    - server_config_multica_legacy_account.rc == 0
    - not ansible_check_mode
  ansible.builtin.user:
    name: "{{ server_config_multica_legacy_user }}"
    state: absent
    remove: true
  tags:
    - multica
    - users

- name: Remove the retired Multica group
  become: true
  become_user: root
  when:
    - server_config_multica_enabled
    - server_config_multica_legacy_account.rc == 0
    - not ansible_check_mode
  ansible.builtin.group:
    name: "{{ server_config_multica_legacy_user }}"
    state: absent
  tags:
    - multica
    - users

- name: Report the planned retired Multica account removal
  when:
    - server_config_multica_enabled
    - server_config_multica_legacy_account.rc == 0
    - ansible_check_mode
  ansible.builtin.debug:
    msg: >-
      Remove the retired {{ server_config_multica_legacy_user }} account after
      revoking its Docker service, ACLs, and subordinate IDs
  changed_when: true
  tags:
    - multica
    - users

- name: Inspect the pinned Multica CLI
  become: true
  become_user: root
  when: server_config_multica_enabled
  ansible.builtin.stat:
    path: "/opt/server-config/multica/{{ server_config_multica_version }}/multica"
  register: server_config_multica_cli_installed
  tags:
    - multica

- name: Create the pinned Multica CLI directories
  become: true
  become_user: root
  when: server_config_multica_enabled
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
    state: directory
  loop:
    - path: /opt/server-config/multica
      mode: "0755"
    - path: "/opt/server-config/multica/{{ server_config_multica_version }}"
      mode: "0755"
    - path: /var/cache/server-config
      mode: "0755"
  tags:
    - multica

- name: Download the pinned Multica CLI
  become: true
  become_user: root
  when:
    - server_config_multica_enabled
    - not ansible_check_mode or server_config_multica_cli_installed.stat.exists
  ansible.builtin.get_url:
    url: "{{ server_config_multica_cli_url }}"
    dest: "/var/cache/server-config/multica-cli-{{ server_config_multica_version }}.tar.gz"
    checksum: "sha256:{{ server_config_multica_cli_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  tags:
    - multica

- name: Extract the pinned Multica CLI
  become: true
  become_user: root
  when:
    - server_config_multica_enabled
    - not ansible_check_mode or server_config_multica_cli_installed.stat.exists
  ansible.builtin.unarchive:
    src: "/var/cache/server-config/multica-cli-{{ server_config_multica_version }}.tar.gz"
    dest: "/opt/server-config/multica/{{ server_config_multica_version }}"
    remote_src: true
    creates: "/opt/server-config/multica/{{ server_config_multica_version }}/multica"
    owner: root
    group: root
  tags:
    - multica

- name: Select the pinned Multica CLI
  become: true
  become_user: root
  when:
    - server_config_multica_enabled
    - not ansible_check_mode or server_config_multica_cli_installed.stat.exists
  ansible.builtin.file:
    src: "/opt/server-config/multica/{{ server_config_multica_version }}/multica"
    dest: /usr/local/bin/multica
    owner: root
    group: root
    state: link
  tags:
    - multica

- name: Report the planned pinned Multica CLI installation
  when:
    - server_config_multica_enabled
    - ansible_check_mode
    - not server_config_multica_cli_installed.stat.exists
  ansible.builtin.debug:
    msg: "Install Multica CLI {{ server_config_multica_version }}"
  changed_when: true
  tags:
    - multica

- name: Verify the pinned Multica CLI
  when:
    - server_config_multica_enabled
    - not ansible_check_mode
  ansible.builtin.command:
    argv:
      - /usr/local/bin/multica
      - version
  register: server_config_multica_cli_version
  changed_when: false
  failed_when: >-
    server_config_multica_version not in server_config_multica_cli_version.stdout
  tags:
    - multica

- name: Create the managed user's Multica runtime directories
  when: server_config_multica_enabled
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "{{ item.mode }}"
    state: directory
  loop:
    - path: "{{ ansible_user_dir }}/.local/state/multica"
      mode: "0700"
    - path: "{{ server_config_multica_pi_dir }}"
      mode: "0700"
    - path: "{{ server_config_multica_agent_workspaces }}"
      mode: "0700"
  tags:
    - multica
    - users

- name: Install the isolated Multica Pi settings
  when: server_config_multica_enabled
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/config/multica/pi-settings.json"
    dest: "{{ server_config_multica_pi_dir }}/settings.json"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0600"
  tags:
    - multica

- name: Install the managed user's Multica Git exclude file
  when: server_config_multica_enabled
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/config/git/ignore"
    dest: "{{ ansible_user_dir }}/.config/git/ignore"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0600"
  tags:
    - git
    - multica

- name: Configure the managed user's Multica Git exclude file
  when: server_config_multica_enabled
  ansible.builtin.blockinfile:
    path: "{{ ansible_user_dir }}/.gitconfig"
    block: |-
      [core]
          excludesFile = ~/.config/git/ignore
    marker: "# {mark} server-config Multica excludes"
    create: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0600"
  tags:
    - git
    - multica

- name: Install the Multica daemon systemd unit
  become: true
  become_user: root
  when: server_config_multica_enabled
  ansible.builtin.template:
    src: multica-daemon.service.j2
    dest: /etc/systemd/system/multica-daemon.service
    owner: root
    group: root
    mode: "0644"
  register: server_config_multica_daemon_unit
  tags:
    - multica

- name: Inspect the Multica CLI profile
  when: server_config_multica_enabled
  ansible.builtin.stat:
    path: "{{ server_config_multica_home }}/.multica/config.json"
  register: server_config_multica_cli_profile
  tags:
    - multica

- name: Enable the Multica daemon
  become: true
  become_user: root
  when:
    - server_config_multica_enabled
    - not ansible_check_mode or not server_config_multica_daemon_unit.changed
  ansible.builtin.systemd_service:
    name: multica-daemon.service
    daemon_reload: true
    enabled: true
  tags:
    - multica

- name: Start the authenticated Multica daemon
  become: true
  become_user: root
  when:
    - server_config_multica_enabled
    - server_config_multica_cli_profile.stat.exists
    - not ansible_check_mode or not server_config_multica_daemon_unit.changed
  ansible.builtin.systemd_service:
    name: multica-daemon.service
    state: started
  tags:
    - multica

- name: Report the planned Multica daemon activation
  when:
    - server_config_multica_enabled
    - ansible_check_mode
    - server_config_multica_daemon_unit.changed
  ansible.builtin.debug:
    msg: >-
      Enable multica-daemon.service. The unit stays inactive until
      {{ server_config_multica_home }}/.multica/config.json exists.
  changed_when: true
  tags:
    - multica
