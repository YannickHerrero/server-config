---
- name: Converge the Ubuntu server base
  hosts: all
  gather_facts: true
  become: "{{ server_config_maintenance_broker | bool }}"
  become_user: "{{ server_config_managed_user }}"

  pre_tasks:
    - name: Require the supported Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_distribution == server_config_supported_distribution
          - ansible_distribution_version == server_config_supported_version
          - ansible_architecture == server_config_supported_architecture
        fail_msg: >-
          This playbook requires {{ server_config_supported_distribution }}
          {{ server_config_supported_version }} on {{ server_config_supported_architecture }}.
      tags:
        - always

    - name: Refuse a root login session
      ansible.builtin.assert:
        that:
          - ansible_user_id != "root"
        fail_msg: Run the playbook as the target user and let Ansible use sudo.
      tags:
        - always

  tasks:
    - name: Refresh the APT package index
      become: true
      become_user: root
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags:
        - packages

    - name: Install base administration packages
      become: true
      become_user: root
      ansible.builtin.apt:
        name: "{{ server_config_packages }}"
        state: present
      tags:
        - packages

    - name: Install headless browser runtime packages
      become: true
      become_user: root
      ansible.builtin.apt:
        name: "{{ server_config_headless_browser_packages }}"
        state: present
      tags:
        - headless-browser
        - packages

    - name: Install the pinned rootless container runtime
      ansible.builtin.import_tasks: tasks/docker.yml
      tags:
        - docker

    - name: Configure headless Android QA
      ansible.builtin.import_tasks: tasks/android.yml
      tags:
        - android

    - name: Retire legacy host-managed Multica services
      ansible.builtin.import_tasks: tasks/multica-retirement.yml
      tags:
        - multica

    - name: Set the timezone file
      become: true
      become_user: root
      ansible.builtin.copy:
        content: "{{ server_config_timezone }}\n"
        dest: /etc/timezone
        owner: root
        group: root
        mode: "0644"
      tags:
        - time

    - name: Link the system timezone
      become: true
      become_user: root
      ansible.builtin.file:
        src: "/usr/share/zoneinfo/{{ server_config_timezone }}"
        dest: /etc/localtime
        owner: root
        group: root
        state: link
        force: true
      tags:
        - time

    - name: Configure periodic APT jobs
      become: true
      become_user: root
      ansible.builtin.template:
        src: 20auto-upgrades.j2
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
      tags:
        - updates

    - name: Disable unattended automatic reboots
      become: true
      become_user: root
      ansible.builtin.template:
        src: 52server-config-unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/52server-config-unattended-upgrades
        owner: root
        group: root
        mode: "0644"
      tags:
        - updates

    - name: Enable maintenance timers
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
        - fstrim.timer
      tags:
        - storage
        - updates

    - name: Inspect the swap file
      when: server_config_swap_enabled
      ansible.builtin.stat:
        path: "{{ server_config_swap_path }}"
      register: server_config_swap_stat
      tags:
        - swap

    - name: Refuse to replace an unexpected swap file
      when:
        - server_config_swap_enabled
        - server_config_swap_stat.stat.exists
      ansible.builtin.assert:
        that:
          - server_config_swap_stat.stat.isreg
          - server_config_swap_stat.stat.size == server_config_swap_size_mb * 1024 * 1024
        fail_msg: >-
          {{ server_config_swap_path }} exists with an unexpected type or size.
          Inspect it before changing the managed swap configuration.
      tags:
        - swap

    - name: Allocate the swap file
      become: true
      become_user: root
      when:
        - server_config_swap_enabled
        - not server_config_swap_stat.stat.exists
      ansible.builtin.command:
        argv:
          - fallocate
          - -l
          - "{{ server_config_swap_size_mb }}M"
          - "{{ server_config_swap_path }}"
        creates: "{{ server_config_swap_path }}"
      tags:
        - swap

    - name: Restrict swap file permissions
      become: true
      become_user: root
      when:
        - server_config_swap_enabled
        - server_config_swap_stat.stat.exists or not ansible_check_mode
      ansible.builtin.file:
        path: "{{ server_config_swap_path }}"
        owner: root
        group: root
        mode: "0600"
        state: file
      tags:
        - swap

    - name: Inspect the swap file format
      become: true
      become_user: root
      when: server_config_swap_enabled
      ansible.builtin.command:
        argv:
          - blkid
          - -o
          - value
          - -s
          - TYPE
          - "{{ server_config_swap_path }}"
      register: server_config_swap_type
      changed_when: false
      failed_when: false
      check_mode: false
      tags:
        - swap

    - name: Format the swap file
      become: true
      become_user: root
      when:
        - server_config_swap_enabled
        - server_config_swap_type.stdout != "swap"
      ansible.builtin.command:
        argv:
          - mkswap
          - "{{ server_config_swap_path }}"
      changed_when: true
      tags:
        - swap

    - name: Persist the swap file
      become: true
      become_user: root
      when: server_config_swap_enabled
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^{{ server_config_swap_path | regex_escape }}\\s"
        line: "{{ server_config_swap_path }} none swap sw 0 0"
        owner: root
        group: root
        mode: "0644"
        state: present
      tags:
        - swap

    - name: Read active swap devices
      when: server_config_swap_enabled
      ansible.builtin.command:
        argv:
          - swapon
          - --show=NAME
          - --noheadings
      register: server_config_active_swap
      changed_when: false
      check_mode: false
      tags:
        - swap

    - name: Activate the swap file
      become: true
      become_user: root
      when:
        - server_config_swap_enabled
        - server_config_swap_path not in server_config_active_swap.stdout_lines
      ansible.builtin.command:
        argv:
          - swapon
          - "{{ server_config_swap_path }}"
      changed_when: true
      tags:
        - swap

    - name: Install pinned user runtimes and CLIs
      ansible.builtin.import_tasks: tasks/mise.yml
      tags:
        - mise
        - runtimes

    - name: Read the installed Herdr version
      ansible.builtin.command:
        argv:
          - "{{ ansible_user_dir }}/.local/bin/herdr"
          - --version
      register: server_config_installed_herdr
      changed_when: false
      failed_when: false
      check_mode: false
      tags:
        - herdr

    - name: Install the pinned Herdr workspace manager
      when: server_config_installed_herdr.stdout != 'herdr ' + server_config_herdr_version
      ansible.builtin.get_url:
        url: "{{ server_config_herdr_url }}"
        dest: "{{ ansible_user_dir }}/.local/bin/herdr"
        checksum: "sha256:{{ server_config_herdr_sha256 }}"
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        mode: "0755"
        force: true
      tags:
        - herdr

    - name: Configure the isolated Transmission daemon
      ansible.builtin.import_tasks: tasks/transmission.yml
      tags:
        - transmission

    - name: Configure tracked user settings
      ansible.builtin.import_tasks: tasks/user-config.yml
      tags:
        - user-config

    - name: Configure the interactive shell
      ansible.builtin.import_tasks: tasks/shell.yml
      tags:
        - shell

    - name: Build the interactive onboarding
      ansible.builtin.import_tasks: tasks/onboarding.yml
      tags:
        - onboarding

    - name: Configure Neovim
      ansible.builtin.import_tasks: tasks/neovim.yml
      tags:
        - neovim

    - name: Install the Tailscale archive key
      become: true
      become_user: root
      ansible.builtin.get_url:
        url: "{{ server_config_tailscale_key_url }}"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        checksum: "sha256:{{ server_config_tailscale_key_sha256 }}"
        owner: root
        group: root
        mode: "0644"
      tags:
        - access
        - tailscale

    - name: Configure the Tailscale APT repository
      become: true
      become_user: root
      ansible.builtin.template:
        src: tailscale.list.j2
        dest: /etc/apt/sources.list.d/tailscale.list
        owner: root
        group: root
        mode: "0644"
      tags:
        - access
        - tailscale

    - name: Install Tailscale
      become: true
      become_user: root
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true
      tags:
        - access
        - tailscale

    - name: Enable the Tailscale service
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: tailscaled
        enabled: true
        state: started
      tags:
        - access
        - tailscale

    - name: Remove the unused DNS server
      become: true
      become_user: root
      ansible.builtin.apt:
        name: bind9
        state: absent
        purge: true
      tags:
        - access
        - packages

    - name: Read the Tailscale state
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - tailscale
          - status
          - --json
      register: server_config_tailscale_status_raw
      changed_when: false
      failed_when: false
      check_mode: false
      tags:
        - access
        - tailscale

    - name: Require an authenticated Tailscale node
      ansible.builtin.assert:
        that:
          - server_config_tailscale_status_raw.rc == 0
          - server_config_tailscale_status_raw.stdout | trim | length > 0
        fail_msg: >-
          Tailscale is installed but not authenticated. Run
          sudo tailscale up --hostname="$(hostname)" --operator="$(id -un)" --ssh=false,
          then apply server-config again. No firewall or SSH restriction was changed.
      tags:
        - access
        - tailscale

    - name: Parse the Tailscale state
      ansible.builtin.set_fact:
        server_config_tailscale_status: "{{ server_config_tailscale_status_raw.stdout | from_json }}"
      tags:
        - access
        - tailscale

    - name: Require a running Tailscale backend
      ansible.builtin.assert:
        that:
          - server_config_tailscale_status.BackendState == "Running"
          - server_config_tailscale_status.TailscaleIPs | select('match', '^100[.]') | list | length > 0
        fail_msg: >-
          Tailscale must be authenticated and running with an IPv4 address before server-config can restrict
          SSH and UFW. Run sudo tailscale up --hostname="$(hostname)" --operator="$(id -un)" --ssh=false,
          then apply server-config again.
      tags:
        - access
        - tailscale

    - name: Install Mosh for private remote sessions
      become: true
      become_user: root
      ansible.builtin.apt:
        name: mosh
        state: present
      tags:
        - access
        - mosh
        - packages

    - name: Keep Tailscale SSH disabled
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - --ssh=false
      changed_when: false
      tags:
        - access
        - tailscale

    - name: Configure OpenSSH access
      become: true
      become_user: root
      ansible.builtin.template:
        src: 00-server-config-sshd.conf.j2
        dest: /etc/ssh/sshd_config.d/00-server-config.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload OpenSSH
      tags:
        - access
        - ssh

    - name: Enable the OpenSSH socket
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: ssh.socket
        enabled: true
        state: started
      tags:
        - access
        - ssh

    - name: Read the effective OpenSSH configuration
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
      register: server_config_sshd_effective
      changed_when: false
      check_mode: false
      tags:
        - access
        - ssh

    - name: Verify the effective OpenSSH configuration
      ansible.builtin.assert:
        that:
          - "'passwordauthentication yes' in server_config_sshd_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in server_config_sshd_effective.stdout_lines"
          - "'permitemptypasswords no' in server_config_sshd_effective.stdout_lines"
          - "'permitrootlogin no' in server_config_sshd_effective.stdout_lines"
          - "'allowusers ' + ansible_user_id in server_config_sshd_effective.stdout_lines"
        fail_msg: The effective OpenSSH settings do not match the managed access policy.
      tags:
        - access
        - ssh

    - name: Reload OpenSSH before configuring the firewall
      ansible.builtin.meta: flush_handlers
      tags:
        - access
        - ssh

    - name: Configure UFW default policies
      become: true
      become_user: root
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}=\"{{ item.value }}\""
        owner: root
        group: root
        mode: "0644"
      loop:
        - key: DEFAULT_INPUT_POLICY
          value: DROP
        - key: DEFAULT_OUTPUT_POLICY
          value: ACCEPT
        - key: DEFAULT_FORWARD_POLICY
          value: DROP
      notify: Reload UFW
      tags:
        - access
        - firewall

    - name: Allow OpenSSH only through Tailscale
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - ufw
          - allow
          - in
          - "on"
          - tailscale0
          - to
          - any
          - port
          - "22"
          - proto
          - tcp
          - comment
          - SSH over Tailscale
      register: server_config_ufw_ssh_rule
      changed_when: "'Rules updated' in server_config_ufw_ssh_rule.stdout"
      tags:
        - access
        - firewall

    - name: Read the current Mosh firewall state
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - ufw
          - status
      register: server_config_ufw_mosh_status
      changed_when: false
      check_mode: false
      tags:
        - access
        - firewall
        - mosh

    - name: Allow Mosh only through Tailscale
      become: true
      become_user: root
      ansible.builtin.command:
        argv: >-
          {{
            ['ufw']
            + (['--dry-run'] if ansible_check_mode else [])
            + [
              'allow', 'in', 'on', 'tailscale0', 'to', 'any',
              'port', server_config_mosh_port_range, 'proto', 'udp',
              'comment', 'Mosh over Tailscale'
            ]
          }}
      changed_when: >-
        server_config_mosh_port_range + '/udp on tailscale0'
        not in server_config_ufw_mosh_status.stdout
      check_mode: false
      tags:
        - access
        - firewall
        - mosh

    - name: Allow direct Tailscale transport
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - ufw
          - allow
          - in
          - "on"
          - "{{ ansible_default_ipv4.interface }}"
          - to
          - any
          - port
          - "{{ server_config_tailscale_port | string }}"
          - proto
          - udp
          - comment
          - Tailscale direct
      register: server_config_ufw_tailscale_rule
      changed_when: "'Rules updated' in server_config_ufw_tailscale_rule.stdout"
      tags:
        - access
        - firewall

    - name: Allow public Transmission peer traffic
      become: true
      become_user: root
      ansible.builtin.command:
        argv: >-
          {{
            ['ufw']
            + (['--dry-run'] if ansible_check_mode else [])
            + [
              'allow', 'in', 'to', 'any',
              'port', server_config_transmission_peer_port | string,
              'proto', item, 'comment', 'Transmission peers'
            ]
          }}
      loop:
        - tcp
        - udp
      register: server_config_ufw_transmission_rules
      changed_when: "'Rules updated' in server_config_ufw_transmission_rules.stdout"
      check_mode: false
      tags:
        - access
        - firewall
        - transmission

    - name: Read the configured UFW commands
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - ufw
          - show
          - added
      register: server_config_ufw_added
      changed_when: false
      check_mode: false
      tags:
        - access
        - firewall

    - name: Remove the temporary release-upgrade SSH rule
      become: true
      become_user: root
      when: "'port 1022' in server_config_ufw_added.stdout"
      ansible.builtin.command:
        argv:
          - ufw
          - delete
          - allow
          - in
          - "on"
          - tailscale0
          - to
          - any
          - port
          - "1022"
          - proto
          - tcp
      changed_when: true
      tags:
        - access
        - firewall

    - name: Read the UFW state
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - ufw
          - status
      register: server_config_ufw_status
      changed_when: false
      check_mode: false
      tags:
        - access
        - firewall

    - name: Enable UFW
      become: true
      become_user: root
      when: "'Status: inactive' in server_config_ufw_status.stdout"
      ansible.builtin.command:
        argv:
          - ufw
          - --force
          - enable
      changed_when: true
      tags:
        - access
        - firewall

    - name: Enable the UFW service
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: ufw
        enabled: true
        state: started
      tags:
        - access
        - firewall

    - name: Apply pending firewall changes
      ansible.builtin.meta: flush_handlers
      tags:
        - access
        - firewall

    - name: Read the final UFW state
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: server_config_ufw_final
      changed_when: false
      check_mode: false
      tags:
        - access
        - firewall

    - name: Verify the final UFW state
      ansible.builtin.assert:
        that:
          - "'Status: active' in server_config_ufw_final.stdout_lines"
          - "'Default: deny (incoming), allow (outgoing)' in server_config_ufw_final.stdout"
          - "'22/tcp on tailscale0' in server_config_ufw_final.stdout"
          - >-
            ansible_check_mode or
            server_config_mosh_port_range + '/udp on tailscale0' in server_config_ufw_final.stdout
          - >-
            (server_config_tailscale_port | string) + '/udp on '
            + ansible_default_ipv4.interface in server_config_ufw_final.stdout
          - >-
            (server_config_transmission_peer_port | string) + '/tcp'
            in server_config_ufw_final.stdout
          - >-
            (server_config_transmission_peer_port | string) + '/udp'
            in server_config_ufw_final.stdout
        fail_msg: UFW does not match the managed access policy.
      tags:
        - access
        - firewall

    - name: Configure the Citadel controller
      ansible.builtin.import_tasks: tasks/citadel.yml
      tags:
        - citadel

    - name: Configure bounded server-config maintenance windows
      ansible.builtin.import_tasks: tasks/maintenance-window.yml
      tags:
        - maintenance-window

  handlers:
    - name: Reload OpenSSH
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded

    - name: Reload UFW
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - ufw
          - reload
      changed_when: true
