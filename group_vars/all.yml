---
server_config_supported_distribution: Ubuntu
server_config_supported_version: "24.04"
server_config_supported_architecture: x86_64
server_config_timezone: Etc/UTC
server_config_managed_user: "{{ lookup('env', 'USER') }}"
server_config_maintenance_broker: false
server_config_maintenance_window_max_minutes: 480
server_config_repo_dir: "{{ ansible_user_dir }}/dev/server-config"

server_config_mise_version: "2026.5.15"
server_config_mise_url: https://github.com/jdx/mise/releases/download/v2026.5.15/mise-v2026.5.15-linux-x64
server_config_mise_sha256: a86aa65c8ca48a548c3f9904853489383bb8cdebfd8f2cf8ddd18b675e03bbf4

server_config_node_version: "24.16.0"
server_config_tree_sitter_version: "0.26.9"
server_config_pi_version: "0.84.3"
server_config_legacy_node_install_dir: /opt/node-v24.16.0-linux-x64
server_config_legacy_node_archive_path: /var/cache/server-config/node-v24.16.0-linux-x64.tar.xz

server_config_herdr_version: "0.7.1"
server_config_onboarding_version: "0.1.0"
server_config_herdr_url: https://github.com/herdrdev/herdr/releases/download/v0.7.1/herdr-linux-x86_64
server_config_herdr_sha256: b965acaffc2c22f54b6e6c64af7cf8e98a3f4ac2622630a0599c67a4b9d8a654

server_config_zsh_plugins:
  - name: fzf-tab
    repo: https://github.com/Aloxaf/fzf-tab.git
    version: e394092c17277c84cb3d234917c4ac1073102ba6
  - name: zsh-autosuggestions
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    version: 85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5
  - name: zsh-completions
    repo: https://github.com/zsh-users/zsh-completions.git
    version: 6d21c2a1de9cb88479a0e67df492da3f3bbdb054
  - name: zsh-syntax-highlighting
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    version: 1d85c692615a25fe2293bdd44b34c217d5d2bf04

server_config_tailscale_key_url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
server_config_tailscale_key_sha256: 3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
server_config_tailscale_repository: >-
  deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
  https://pkgs.tailscale.com/stable/ubuntu noble main
server_config_tailscale_port: 41641

server_config_swap_enabled: true
server_config_swap_path: /swap.img
server_config_swap_size_mb: 8192

server_config_citadel_enabled: true
server_config_citadel_repo_dir: "{{ ansible_user_dir }}/dev/citadel"
server_config_citadel_port: 9860
server_config_citadel_supervisor_config: "{{ ansible_user_dir }}/.local/state/citadel/supervisord.conf"
server_config_citadel_packages:
  - supervisor

server_config_packages:
  - ansible-core
  - ansible-lint
  - build-essential
  - ca-certificates
  - curl
  - git
  - jq
  - less
  - lsof
  - mdadm
  - python3
  - python3-apt
  - ripgrep
  - rsync
  - shellcheck
  - smartmontools
  - sudo
  - ufw
  - unattended-upgrades
  - unzip
  - xz-utils
  - yamllint
  - zip
  - zsh

# Runtime libraries for project-scoped Playwright Chromium headless shells.
# Keep browsers themselves in each project's package-managed Playwright cache.
server_config_headless_browser_packages:
  - fonts-liberation
  - fonts-noto-color-emoji
  - libasound2t64
  - libatk-bridge2.0-0t64
  - libatk1.0-0t64
  - libatspi2.0-0t64
  - libcairo2
  - libcups2t64
  - libdbus-1-3
  - libdrm2
  - libgbm1
  - libglib2.0-0t64
  - libnspr4
  - libnss3
  - libpango-1.0-0
  - libx11-6
  - libxcb1
  - libxcomposite1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxkbcommon0
  - libxrandr2
