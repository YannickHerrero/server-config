---
server_config_supported_distribution: Ubuntu
server_config_supported_version: "24.04"
server_config_supported_architecture: x86_64
server_config_timezone: Etc/UTC
server_config_repo_dir: "{{ ansible_user_dir }}/dev/server-config"

server_config_mise_version: "2026.5.15"
server_config_mise_url: https://github.com/jdx/mise/releases/download/v2026.5.15/mise-v2026.5.15-linux-x64
server_config_mise_sha256: a86aa65c8ca48a548c3f9904853489383bb8cdebfd8f2cf8ddd18b675e03bbf4

server_config_node_version: "24.16.0"
server_config_pi_version: "0.84.3"
server_config_legacy_node_install_dir: /opt/node-v24.16.0-linux-x64
server_config_legacy_node_archive_path: /var/cache/server-config/node-v24.16.0-linux-x64.tar.xz

server_config_herdr_version: "0.7.1"
server_config_herdr_url: https://github.com/herdrdev/herdr/releases/download/v0.7.1/herdr-linux-x86_64
server_config_herdr_sha256: b965acaffc2c22f54b6e6c64af7cf8e98a3f4ac2622630a0599c67a4b9d8a654

server_config_tailscale_key_url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
server_config_tailscale_key_sha256: 3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
server_config_tailscale_repository: >-
  deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
  https://pkgs.tailscale.com/stable/ubuntu noble main
server_config_tailscale_port: 41641

server_config_swap_enabled: true
server_config_swap_path: /swap.img
server_config_swap_size_mb: 8192

server_config_packages:
  - ansible-core
  - ansible-lint
  - ca-certificates
  - curl
  - git
  - jq
  - less
  - lsof
  - mdadm
  - python3
  - python3-apt
  - ripgrep
  - rsync
  - shellcheck
  - smartmontools
  - sudo
  - ufw
  - unattended-upgrades
  - unzip
  - xz-utils
  - yamllint
  - zip
