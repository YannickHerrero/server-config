---
server_config_supported_distribution: Ubuntu
server_config_supported_version: "24.04"
server_config_supported_architecture: x86_64
server_config_timezone: Etc/UTC
server_config_managed_user: "{{ lookup('env', 'USER') }}"
server_config_maintenance_broker: false
server_config_maintenance_window_max_minutes: 480
server_config_repo_dir: "{{ ansible_user_dir }}/dev/server-config"

server_config_mise_version: "2026.5.15"
server_config_mise_url: https://github.com/jdx/mise/releases/download/v2026.5.15/mise-v2026.5.15-linux-x64
server_config_mise_sha256: a86aa65c8ca48a548c3f9904853489383bb8cdebfd8f2cf8ddd18b675e03bbf4

server_config_node_version: "24.16.0"
server_config_tree_sitter_version: "0.26.9"
server_config_pi_version: "0.84.3"
server_config_legacy_node_install_dir: /opt/node-v24.16.0-linux-x64
server_config_legacy_node_archive_path: /var/cache/server-config/node-v24.16.0-linux-x64.tar.xz

server_config_herdr_version: "0.8.2"
server_config_onboarding_version: "0.1.0"
server_config_herdr_url: https://github.com/herdrdev/herdr/releases/download/v0.8.2/herdr-linux-x86_64
server_config_herdr_sha256: 976150a14d490c94b243ea2e1a7eb2dfb67f12e36b182db90936f6728e6aecf4

server_config_zsh_plugins:
  - name: fzf-tab
    repo: https://github.com/Aloxaf/fzf-tab.git
    version: e394092c17277c84cb3d234917c4ac1073102ba6
  - name: zsh-autosuggestions
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    version: 85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5
  - name: zsh-completions
    repo: https://github.com/zsh-users/zsh-completions.git
    version: 6d21c2a1de9cb88479a0e67df492da3f3bbdb054
  - name: zsh-syntax-highlighting
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    version: 1d85c692615a25fe2293bdd44b34c217d5d2bf04

server_config_tailscale_key_url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
server_config_tailscale_key_sha256: 3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
server_config_tailscale_repository: >-
  deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
  https://pkgs.tailscale.com/stable/ubuntu noble main
server_config_tailscale_port: 41641
server_config_mosh_port_range: "60000:61000"

server_config_swap_enabled: true
server_config_swap_path: /swap.img
server_config_swap_size_mb: 8192

server_config_citadel_enabled: true
server_config_citadel_repo_dir: "{{ ansible_user_dir }}/dev/citadel"
server_config_citadel_port: 9860
server_config_citadel_supervisor_config: "{{ ansible_user_dir }}/.local/state/citadel/supervisord.conf"
server_config_citadel_packages:
  - supervisor

server_config_docker_version: "29.1.3"
server_config_docker_url: https://download.docker.com/linux/static/stable/x86_64/docker-29.1.3.tgz
server_config_docker_sha256: c019c608ba2bb009dd673f3230e4d743f36a78d36166c6c2444c05d0aa9ff0d9
server_config_docker_rootless_url: >-
  https://download.docker.com/linux/static/stable/x86_64/docker-rootless-extras-29.1.3.tgz
server_config_docker_rootless_sha256: 32dc3dd0d8b512ccf30a7efe84d360b5ade65ac4fec92a2a5ad0fe791da6ab0d
server_config_docker_compose_version: "2.40.3"
server_config_docker_compose_url: >-
  https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64
server_config_docker_compose_sha256: dba9d98e1ba5bfe11d88c99b9bd32fc4a0624a30fafe68eea34d61a3e42fd372
server_config_docker_buildx_version: "0.36.1"
server_config_docker_buildx_url: >-
  https://github.com/docker/buildx/releases/download/v0.36.1/buildx-v0.36.1.linux-amd64
server_config_docker_buildx_sha256: 48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778
server_config_docker_install_dir: "/opt/server-config/docker/{{ server_config_docker_version }}"
server_config_docker_runtime_dir: /run/server-config-docker
server_config_docker_packages:
  - acl
  - apparmor
  - dbus-user-session
  - fuse-overlayfs
  - iptables
  - openssl
  - slirp4netns
  - uidmap

server_config_android_enabled: true
server_config_android_sdk_root: /opt/android-sdk
server_config_android_commandline_tools_version: "23.0"
server_config_android_commandline_tools_url: >-
  https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
server_config_android_commandline_tools_sha256: 0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8
server_config_android_api_level: "35"
server_config_android_build_tools_version: "35.0.0"
server_config_android_system_image: system-images;android-35;google_apis;x86_64
server_config_android_packages:
  - "build-tools;{{ server_config_android_build_tools_version }}"
  - emulator
  - platform-tools
  - "platforms;android-{{ server_config_android_api_level }}"
  - "{{ server_config_android_system_image }}"
server_config_android_host_packages:
  - libgl1
  - libpulse0
  - libxkbcommon-x11-0
  - openjdk-21-jdk-headless

server_config_packages:
  - ansible-core
  - ansible-lint
  - build-essential
  - ca-certificates
  - curl
  - git
  - jq
  - less
  - lsof
  - mdadm
  - python3
  - python3-apt
  - python3-yaml
  - ripgrep
  - rsync
  - shellcheck
  - smartmontools
  - sudo
  - ufw
  - unattended-upgrades
  - unzip
  - xz-utils
  - yamllint
  - zip
  - zsh

# Runtime libraries for project-scoped Playwright Chromium headless shells.
# Keep browsers themselves in each project's package-managed Playwright cache.
server_config_headless_browser_packages:
  - fonts-liberation
  - fonts-noto-color-emoji
  - libasound2t64
  - libatk-bridge2.0-0t64
  - libatk1.0-0t64
  - libatspi2.0-0t64
  - libcairo2
  - libcups2t64
  - libdbus-1-3
  - libdrm2
  - libgbm1
  - libglib2.0-0t64
  - libnspr4
  - libnss3
  - libpango-1.0-0
  - libx11-6
  - libxcb1
  - libxcomposite1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxkbcommon0
  - libxrandr2
